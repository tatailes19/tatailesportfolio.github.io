<header class="masthead">
  <div class="bg-shape-1"></div>
  <div class="bg-shape-2"></div>

  <div class="container header-container">
    <div class="row">
      <div class="col-lg-12">
        
        <div class="header-content">
          <div class="profile-wrapper-modern">
            <img 
              class="img-profile-modern" 
              src="img/1729096765851.jpeg" 
              alt="profile-pic" 
            />
            <div class="profile-ring"></div>
          </div>

          <div class="glass-header-card">
            <h1 class="name-modern">{{ site.title }}</h1>
            <div class="header-divider-modern"></div>
            <p class="skills-modern">{{ site.skills }}</p>
            
            <div class="header-actions">
              <a href="#portfolio" class="btn-primary-purple">
                View Projects
              </a>
              <a href="#contact" class="btn-secondary-white">
                Contact Me
              </a>
            </div>
          </div>
          
          <a href="#services" class="scroll-indicator">
            <span>Explore</span>
            <i class="fa fa-chevron-down"></i>
          </a>
        </div>

      </div>
    </div>
  </div>
</header>
